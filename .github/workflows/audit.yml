name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources

    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: arkret-org/coland

      - name: Checkout workspace dependencies
        uses: ./arkret-org/coland/.github/actions/checkout-workspace
        with:
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: cargo-deny check ${{ matrix.checks }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: arkret-org/coland/Cargo.toml
          command: check ${{ matrix.checks }}
          arguments: --all-features
