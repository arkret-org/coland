[workspace]
resolver = "3"
members = [
    "crates/contracts",
    "crates/domain",
    "crates/http",
    "crates/keystore-keygen",
    "crates/server",
    "crates/services",
    "crates/storage",
    "crates/storage-postgres",
    "crates/test-support",
    "xtask",
]
default-members = ["crates/server"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/arkret-org/coland"
homepage = "https://github.com/arkret-org/coland"
authors = ["Arkret contributors"]

# Full type debug information can push this crate's COFF archive past the
# 32-bit member-offset limit. Keep source locations for development backtraces.
[profile.dev.package.coland-storage-postgres]
debug = "line-tables-only"

# Workspace lint baseline. Every member opts in with `[lints] workspace = true`.
#
# The entries below are all at zero occurrences today, so this is a ratchet
# rather than a cleanup: it stops the next one from landing. `unsafe_code` is
# denied outright; the process-environment wrappers that genuinely need it
# carry a local `#[allow(unsafe_code, reason = ...)]` naming the reason.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.2"
arkret = { version = "0.3.0", path = "../arkret-rust-sdk/crates/sdk", default-features = false }
arkret-bootstrap = { version = "0.3.0", path = "../arkret-rust-sdk/crates/bootstrap", default-features = false }
arkret-canonical = { version = "0.3.0", path = "../arkret-rust-sdk/crates/canonical", default-features = false }
arkret-crypto = { version = "0.3.0", path = "../arkret-rust-sdk/crates/crypto", default-features = false }
arkret-egress-policy = { version = "0.3.0", path = "../arkret-rust-sdk/crates/egress-policy", default-features = false }
arkret-egress-reqwest = { version = "0.3.0", path = "../arkret-rust-sdk/crates/egress-reqwest", default-features = false }
arkret-event-draft = { version = "0.3.0", path = "../arkret-rust-sdk/crates/event-draft", default-features = false }
arkret-hlc = { version = "0.3.0", path = "../arkret-rust-sdk/crates/hlc", default-features = false }
arkret-http-client = { version = "0.3.0", path = "../arkret-rust-sdk/crates/http-client", default-features = false, features = ["tls-rustls"] }
arkret-identifiers = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-identity = { version = "0.3.0", path = "../arkret-rust-sdk/crates/identity", default-features = false }
arkret-keystore = { version = "0.3.0", path = "../arkret-rust-sdk/crates/keystore", default-features = false }
