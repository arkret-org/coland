[package]
name = "coland-storage-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "PostgreSQL storage adapter and database bootstrap for Coland."

[features]
default = []
conformance-harness = []
# Leased test databases (`test_database`). Coland has one storage
# implementation, so every test that needs storage takes a real database from
# this module instead of a second in-memory adapter.
test-support = ["coland-storage/test-support", "arkret-wire/test-support", "arkret-signatures/signer", "dep:arkret-bootstrap", "dep:ed25519-dalek"]

[dependencies]
arkret = { workspace = true, features = ["server"] }
arkret-bootstrap = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
anyhow = { workspace = true }
arkret-canonical.workspace = true
arkret-event-draft.workspace = true
arkret-identifiers = { workspace = true, features = ["diesel"] }
arkret-identity.workspace = true
arkret-mls.workspace = true
arkret-policy.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-models-identity.workspace = true
arkret-models-integration.workspace = true
arkret-state.workspace = true
arkret-schema.workspace = true
arkret-signatures.workspace = true
arkret-wire = { workspace = true, features = ["diesel"] }
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
deadpool = { workspace = true, features = ["rt_tokio_1"] }
diesel = { workspace = true, features = ["postgres", "serde_json", "chrono", "uuid", "pq-src"] }
diesel-async = { workspace = true, features = ["postgres", "deadpool", "async-connection-wrapper"] }
diesel_migrations = { workspace = true, features = ["postgres"] }
parking_lot = { workspace = true }
hmac.workspace = true
rand.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
sha2.workspace = true
coland-domain = { workspace = true }
coland-storage = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
url.workspace = true
uuid = { workspace = true }

[dev-dependencies]
chacha20poly1305 = { workspace = true }
savfox-gateway-server.workspace = true
arkret-http-client.workspace = true
arkret-bridge-runtime = { path = "../../../bridges/crates/runtime", default-features = false, features = ["full", "postgres"] }
arkret = { workspace = true, features = ["mls"] }
reqwest = { workspace = true, features = ["json", "rustls"] }
tracing-subscriber.workspace = true
bytes.workspace = true
futures-util.workspace = true
rustls.workspace = true
tokio-tungstenite.workspace = true
arkret-test-kit.workspace = true
salvo = { workspace = true, features = ["test"] }
coland-test-support.workspace = true
coland-http = { workspace = true, features = ["test-support"] }
arkret-schema-conformance.workspace = true
rand_chacha = "0.10.0"
rand_core = "0.10.1"
arkret-bootstrap.workspace = true
arkret-signatures = { workspace = true, features = ["signer"] }
ed25519-dalek.workspace = true
arkret-mls = { workspace = true, features = ["test-utils"] }
arkret-wire = { workspace = true, features = ["diesel", "test-support"] }
coland-services = { workspace = true }
coland-storage = { workspace = true, features = ["test-support"] }
coland-storage-postgres = { version = "0.3.0", path = ".", features = ["test-support"] }

[lints]
workspace = true
