apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "coland.fullname" . }}
  labels:
    {{- include "coland.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "coland.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "coland.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "coland.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: coland
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range $name, $_ := .Values.secretEnv }}
            - name: {{ $name }}
              valueFrom:
                secretKeyRef:
                  name: {{ default (include "coland.fullname" $) $.Values.existingSecret }}
                  key: {{ $name }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: coland-data
              mountPath: /var/lib/coland
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: coland-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "coland.fullname" .)) .Values.persistence.existingClaim }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
