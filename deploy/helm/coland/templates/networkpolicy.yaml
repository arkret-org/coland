{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "coland.fullname" . }}
  labels:
    {{- include "coland.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "coland.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressCidrs }}
        {{- range .Values.networkPolicy.ingressCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.port }}
  {{- if or .Values.networkPolicy.egress.databaseCidrs .Values.networkPolicy.egress.objectStorageCidrs .Values.networkPolicy.egress.oauthCidrs }}
  egress:
    - to:
        {{- range .Values.networkPolicy.egress.databaseCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.egress.objectStorageCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- range .Values.networkPolicy.egress.oauthCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
