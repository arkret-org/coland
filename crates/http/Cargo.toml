[package]
name = "coland-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Coland HTTP transport, middleware, routing, and OpenAPI surface."

[features]
default = []
# COT-06-002 / `service-http-binding.md` §2.1.2: the `/_arkret/_conformance/*`
# harness is test-only observation / injection. `development_mode` already
# decides whether it is mounted; this feature decides whether it is compiled at
# all, so a default `coland-server` build carries neither the handlers nor the
# seeded notary signer they build fixtures with. `cotest` turns it on when it
# builds the SUT binary.
conformance-harness = ["coland-services/test-support"]
test-support = [
    "arkret-event-draft/test-support",
    "arkret-wire/test-support",
    "coland-services/test-support",
]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
arkret.workspace = true
arkret-bootstrap.workspace = true
arkret-canonical.workspace = true
arkret-crypto = { workspace = true, features = ["account-data"] }
arkret-egress-policy.workspace = true
arkret-egress-reqwest.workspace = true
arkret-event-draft = { workspace = true, features = ["openapi"] }
arkret-hlc.workspace = true
arkret-http-client.workspace = true
arkret-identifiers.workspace = true
arkret-identity.workspace = true
arkret-keystore = { workspace = true, features = ["keystore-macos", "keystore-linux", "keystore-windows", "keystore-encrypted-file"] }
arkret-mls.workspace = true
arkret-models-collaboration = { workspace = true, features = ["openapi"] }
arkret-models-crypto = { workspace = true, features = ["openapi"] }
arkret-models-discovery = { workspace = true, features = ["openapi"] }
arkret-models-identity = { workspace = true, features = ["openapi"] }
arkret-models-integration = { workspace = true, features = ["openapi"] }
arkret-policy.workspace = true
arkret-rate-limit.workspace = true
arkret-schema = { workspace = true }
arkret-server.workspace = true
arkret-signatures = { workspace = true, features = ["collaboration", "keypackages", "service-identity", "signer", "webvh"] }
arkret-state = { workspace = true, features = ["openapi"] }
arkret-wire = { workspace = true, features = ["openapi"] }
async-stream.workspace = true
async-trait.workspace = true
base64.workspace = true
bs58.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
ed25519-dalek.workspace = true
floria-contracts.workspace = true
futures-util.workspace = true
hex.workspace = true
hmac.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { workspace = true, default-features = false }
multra.workspace = true
parking_lot.workspace = true
rand.workspace = true
reqwest = { workspace = true, default-features = false, features = ["form", "json", "rustls"] }
salvo = { workspace = true, default-features = false, features = ["cookie", "fix-http1-request-uri", "server", "server-handle", "oapi", "http1", "http2", "matched-path", "ring", "affix-state", "catch-panic", "cors", "rustls", "websocket"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
coland-contracts = { workspace = true, features = ["openapi"] }
coland-domain.workspace = true
coland-services.workspace = true
coland-storage.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
url = "2.5"
uuid = { workspace = true, features = ["v4", "v7", "serde"] }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
arkret-bridge-runtime = { version = "0.3.0", path = "../../../bridges-realm-actors/crates/runtime", default-features = false, features = ["edge", "managed-authoring"] }
garth = { version = "0.3.0", path = "../../../garth-realm-actors", default-features = false }
rand_chacha = "0.10.0"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
diesel.workspace = true
diesel-async.workspace = true
arkret-mls = { workspace = true, features = ["test-utils"] }
arkret-schema-conformance = { workspace = true }
arkret-test-kit = { workspace = true }
arkret-event-draft = { workspace = true, features = ["test-support"] }
rand = "0.10"
rustls.workspace = true
salvo = { workspace = true, features = ["test"] }
coland-domain.workspace = true
coland-services = { workspace = true, features = ["test-support"] }
coland-storage-postgres = { workspace = true, features = ["test-support"] }
coland-test-support.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[[test]]
name = "development_boundary"
required-features = ["test-support"]

# Exercise Station admission independently of the server's embedded runtime.
[[test]]
name = "applet_admission"
path = "../server/tests/applet_admission.rs"
required-features = ["test-support", "conformance-harness"]

[[test]]
name = "authority_forward_producer_evidence"
path = "../server/tests/authority_forward_producer_evidence.rs"
required-features = ["test-support", "conformance-harness"]
