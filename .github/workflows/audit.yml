name: Supply chain

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources

    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: coland

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Floria contracts workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: cargo-deny check ${{ matrix.checks }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: coland/Cargo.toml
          command: check ${{ matrix.checks }}
          arguments: --all-features
