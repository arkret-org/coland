# cargo-deny configuration. Run `cargo deny check` locally to mirror the
# `Supply chain` GitHub workflow.

[graph]
# Match the runtime + release targets we ship in `release.yml`. Anything not
# listed here is skipped during graph traversal.
targets = [
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-unknown-linux-gnu" },
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "aarch64-apple-darwin" },
]

[advisories]
# object_store 0.14.1 currently reaches yanked spin 0.10.0 through
# crc-fast 1.10.0. Keep this visible as a warning until crc-fast updates its
# spin requirement; vulnerabilities remain denied.
yanked = "warn"
# Informational maintenance notices in the pinned upstream Starlark evaluator
# and Teloxide documentation macros. These have no reported vulnerability or
# patched release; keep the runtime vulnerability checks enabled. Revisit on
# upstream dependency changes rather than ignoring either owning crate.
ignore = [
  "RUSTSEC-2024-0388", # derivative: Starlark derive macro
  "RUSTSEC-2024-0436", # paste: Starlark token-pasting macro
  "RUSTSEC-2025-0057", # fxhash: Starlark's internal maps
  "RUSTSEC-2026-0173", # proc-macro-error2: Teloxide/Aquamarine doc macros
]

[licenses]
# Apache-2.0 + permissive licenses we already depend on. Add to this list only
# after a manual review.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "0BSD",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "OpenSSL",
  "BSL-1.0",
  "PostgreSQL",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
name = "ring"
allow = ["OpenSSL", "ISC", "MIT"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
  # SDK Linux keystore fork; the manifest pins the reviewed commit.
  "https://github.com/arkret-org/secret-service-rs",
  "https://github.com/openmls/openmls.git",
  "https://github.com/open-telemetry/opentelemetry-rust.git",
  "https://github.com/palpo-im/dingtalk-sdk",
  "https://github.com/chrislearn/eventsource-stream.git",
  "https://github.com/helix-editor/nucleo.git",
  "https://github.com/dzbarsky/rules_rust",
]
