[package]
name = "coland-contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Shared deployment-local contracts for Coland integrations."

[features]
default = []
openapi = [
    "dep:salvo-oapi",
    "arkret-identifiers/openapi",
    "arkret-models-collaboration/openapi",
    "arkret-models-crypto/openapi",
    "arkret-wire/openapi",
    "salvo-oapi/chrono",
]

[dependencies]
arkret-canonical.workspace = true
arkret-identifiers.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-wire.workspace = true
chrono = { workspace = true, features = ["serde"] }
salvo-oapi = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = "2.5"

[lints]
workspace = true
