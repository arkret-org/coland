name: Checkout Coland workspace dependencies
description: Preserve the cross-repository Cargo path layout used by Coland and Savfox.
inputs:
  token:
    description: Token for dependency repositories.
    required: true
  frozen:
    description: Use the committed release source set instead of current main.
    default: "false"
runs:
  using: composite
  steps:
    - name: Resolve dependency revisions
      id: revisions
      shell: bash
      env:
        SOURCE_FILE: ${{ github.action_path }}/../../../.ci/release-sources.json
        FROZEN: ${{ inputs.frozen }}
      run: |
        node <<'JS'
        const fs = require('node:fs');
        const revisions = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
        const names = ['sdk', 'floria', 'spec', 'garth', 'bridges', 'savfox'];
        if (Object.keys(revisions).length !== names.length ||
            names.some(name => !/^[0-9a-f]{40}$/.test(revisions[name]))) {
          throw new Error('Invalid release dependency source set');
        }
        for (const name of names) {
          const ref = process.env.FROZEN === 'true' ? revisions[name] : 'main';
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${ref}\n`);
        }
        JS
    - name: Checkout Arkret Rust SDK
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/arkret-rust-sdk
        path: arkret-org/arkret-rust-sdk
        ref: ${{ steps.revisions.outputs.sdk }}
        token: ${{ inputs.token }}
    - name: Checkout Floria contracts workspace
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/floria
        path: arkret-org/floria
        ref: ${{ steps.revisions.outputs.floria }}
        token: ${{ inputs.token }}
    - name: Checkout Arkret Spec
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/arkret-spec
        path: arkret-org/arkret-spec
        ref: ${{ steps.revisions.outputs.spec }}
        token: ${{ inputs.token }}
    - name: Checkout Garth
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/garth
        path: arkret-org/garth
        ref: ${{ steps.revisions.outputs.garth }}
        token: ${{ inputs.token }}
    - name: Checkout bridge runtime workspace
      uses: actions/checkout@v6
      with:
        repository: ${{ github.repository_owner }}/bridges
        path: arkret-org/bridges
        ref: ${{ steps.revisions.outputs.bridges }}
        token: ${{ inputs.token }}
    - name: Checkout Savfox gateway workspace
      uses: actions/checkout@v6
      with:
        repository: savfox-ai/savfox
        path: savfox-ai/savfox
        ref: ${{ steps.revisions.outputs.savfox }}
        token: ${{ inputs.token }}
