name: Docker

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  IMAGE_NAME: coland:ci

jobs:
  image:
    name: Build and scan Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: coland

      - name: Checkout Arkret Rust SDK
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Floria contracts workspace
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout Arkret Spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: coland
          file: coland/Dockerfile
          build-contexts: |
            arkret-rust-sdk=arkret-rust-sdk
            arkret-spec=arkret-spec
            floria=floria
          load: true
          tags: ${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivy-cache:/root/.cache/" \
            aquasec/trivy:0.70.0 image \
              --exit-code 1 \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --no-progress \
              "${IMAGE_NAME}"
