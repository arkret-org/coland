name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v0.1.0) for a manual release run"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: coland
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: coland
            archive: tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: coland.exe
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: coland
            archive: tar.gz

    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: arkret-org/coland

      - name: Checkout workspace dependencies
        uses: ./arkret-org/coland/.github/actions/checkout-workspace
        with:
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/configure-windows-openssl.ps1
        working-directory: arkret-org/coland

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (linux/aarch64)
        if: matrix.cross == true
        run: cargo install cross --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coland -> target
          key: ${{ matrix.target }}

      - name: Build (cargo)
        if: matrix.cross != true
        run: cargo build --release --locked --target ${{ matrix.target }}
        working-directory: arkret-org/coland

      - name: Build (cross)
        if: matrix.cross == true
        run: cross build --release --locked --target ${{ matrix.target }}
        working-directory: arkret-org/coland

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage
          cp "arkret-org/coland/target/${{ matrix.target }}/release/${{ matrix.artifact }}" "stage/${{ matrix.artifact }}"
          cp arkret-org/coland/README.md arkret-org/coland/LICENSE stage/

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="coland-${GITHUB_REF_NAME:-${{ inputs.tag }}}-${{ matrix.target }}"
          tar -C stage -czf "${name}.tar.gz" .
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { '${{ inputs.tag }}' }
          $name = "coland-$tag-${{ matrix.target }}"
          Compress-Archive -Path stage\* -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash + "  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coland-${{ matrix.target }}
          path: |
            coland-*.tar.gz
            coland-*.tar.gz.sha256
            coland-*.zip
            coland-*.zip.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Collect release files
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz*" -o -name "*.zip*" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: release-assets/*
