[package]
name = "coland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "coland"
description = "Reference Arkret v1 Station implementation built on Salvo, Diesel, and PostgreSQL."
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["arkret", "decentralized", "did", "salvo", "server"]
categories = ["network-programming", "web-programming::http-server"]
authors.workspace = true

[features]
default = []
# Compile the development-only `/_arkret/_conformance/*` harness into the
# binary. Off by default; `cotest` enables it for the SUT build.
conformance-harness = [
    "coland-http/conformance-harness",
    "coland-storage-postgres/conformance-harness",
    "coland-storage-postgres/test-support",
]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies]
savfox-gateway-server.workspace = true
anyhow = { workspace = true }
arkret-canonical.workspace = true
arkret-http-client.workspace = true
arkret-identifiers.workspace = true
arkret-identity.workspace = true
arkret-keystore.workspace = true
arkret-models-identity.workspace = true
arkret-signatures = { workspace = true, features = ["keypackages", "signer", "webvh"] }
arkret-state.workspace = true
arkret-wire.workspace = true
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dotenvy = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
object_store = { workspace = true, features = ["aws"] }
opentelemetry = { workspace = true, default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { workspace = true, default-features = false, features = ["trace", "grpc-tonic"], optional = true }
opentelemetry_sdk = { workspace = true, default-features = false, features = ["trace", "rt-tokio"], optional = true }
# ChaCha20 rng seeded from OS entropy for the self-bootstrap mint. Pinned to
# 0.3 so its `rand_core` 0.6 `RngCore` matches the SDK inception primitive
# (the dalek stack pins that ecosystem); already in the lock tree via the SDK.
rand_chacha = "0.10.0"
reqwest = { workspace = true, default-features = false, features = ["form", "json", "rustls"] }
rustls = { workspace = true }
salvo = { workspace = true, default-features = false, features = ["cookie", "fix-http1-request-uri", "server", "server-handle", "http1", "http2", "matched-path", "ring", "affix-state", "catch-panic", "cors", "rustls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
coland-http = { workspace = true }
coland-services = { workspace = true }
coland-storage = { workspace = true }
coland-storage-postgres = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true, default-features = false, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
# `url::Url` to feed the shared SDK `webvh::prepare_service_inception` primitive
# when self-bootstrapping the deployment's own service DID (identity-did §3.7).
# Already present in the lock tree via arkret-sdk.
url = "2.5"
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
getrandom.workspace = true
garth = { version = "0.3.0", path = "../../../garth", default-features = false }
arkret-bridge-runtime = { version = "0.3.0", path = "../../../bridges/crates/runtime", default-features = false, features = ["edge", "managed-authoring"] }
coland-contracts.workspace = true
diesel = { workspace = true, features = ["postgres", "serde_json"] }
diesel-async = { workspace = true, features = ["postgres", "deadpool"] }
arkret-schema-conformance = { workspace = true }
arkret.workspace = true
arkret-bootstrap.workspace = true
arkret-crypto = { workspace = true, features = ["account-data"] }
arkret-event-draft = { workspace = true, features = ["test-support"] }
arkret-mls.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-models-discovery.workspace = true
arkret-models-integration.workspace = true
arkret-policy.workspace = true
arkret-schema = { workspace = true }
bs58 = { workspace = true }
floria-contracts = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
parking_lot = { workspace = true }
proptest = { workspace = true }
salvo = { workspace = true, features = ["test"] }
coland-domain = { workspace = true }
coland-http = { workspace = true, features = ["test-support", "conformance-harness"] }
coland-test-support = { workspace = true }
# `test-util` enables the paused-clock test runtime
# (`#[tokio::test(start_paused = true)]`) used to assert the federation
# auth-failure timing-bucket pad deterministically without a real sleep.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
