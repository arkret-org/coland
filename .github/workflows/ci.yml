name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  typos:
    name: Typos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout coland
        uses: actions/checkout@v6

      - name: Check spelling
        uses: crate-ci/typos@v1.45.2

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: arkret-org/coland

      - name: Checkout workspace dependencies
        uses: ./arkret-org/coland/.github/actions/checkout-workspace
        with:
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Windows OpenSSL configuration regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/tests/configure-windows-openssl.tests.ps1
        working-directory: arkret-org/coland

      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/configure-windows-openssl.ps1
        working-directory: arkret-org/coland

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coland -> target

      # ARC-0002 (重构计划 2026-07-10): legacy patterns must ratchet to zero.
      - name: Deletion gate
        run: bash scripts/deletion_gate.sh
        working-directory: arkret-org/coland
        shell: bash

      - name: Environment documentation gate
        run: python scripts/check-env-docs.py
        working-directory: arkret-org/coland

      - name: Test-support surface gate
        run: python scripts/check-test-support-surface.py
        working-directory: arkret-org/coland

      - name: Typed error mapping gate regression tests
        run: python -m unittest discover -s scripts -p test_check_error_mapping.py
        working-directory: arkret-org/coland

      - name: Typed error mapping gate
        run: python scripts/check-error-mapping.py
        working-directory: arkret-org/coland

      - name: SDK wire type ownership gate
        run: python ../arkret-rust-sdk/tools/wire_type_ownership_audit.py --workspace-root .. --require-repository coland
        working-directory: arkret-org/coland

      - name: Crate layering gate
        run: cargo +1.98 run -p xtask --bin check_layering --locked
        working-directory: arkret-org/coland

      - name: Rustfmt
        # Format every Coland member; dependency repositories own their gates.
        run: cargo +nightly fmt -- --check
        working-directory: arkret-org/coland

      - name: Clippy
        run: cargo +1.98 clippy --all-targets --locked -- -D warnings
        working-directory: arkret-org/coland

      - name: Standalone HTTP feature surface
        if: runner.os == 'Linux'
        run: cargo +1.98 clippy --locked -p coland-http --lib --features conformance-harness -- -D warnings
        working-directory: arkret-org/coland

      - name: KeyStore keygen Clippy
        run: cargo +1.98 clippy --locked -p coland-keystore-keygen --all-targets -- -D warnings
        working-directory: arkret-org/coland

      - name: KeyStore keygen tests
        run: cargo +1.98 test --locked -p coland-keystore-keygen
        working-directory: arkret-org/coland

      - name: Clippy with OpenTelemetry
        run: cargo +1.98 clippy --features otel --all-targets --locked -- -D warnings
        working-directory: arkret-org/coland

      # Keep test binaries separate from `target/dev`, matching the local
      # `just test` gate and preventing Windows dev-server file locks.
      #
      # Coland persists through one adapter, so every test that needs storage
      # leases a real database and fails without one. Service containers only
      # run on Linux, so this matrix runs the crates that need no database and
      # the Linux-only `postgres-workspace` job below runs the rest.
      - name: Test (no database required)
        env:
          CARGO_TARGET_DIR: target/test
        run: >-
          cargo +1.98 test --locked
          -p coland-domain -p coland-contracts -p coland-keystore-keygen
        working-directory: arkret-org/coland

  postgres-workspace:
    name: Workspace tests (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coland
          POSTGRES_PASSWORD: coland
          POSTGRES_DB: coland_ws
        ports:
          - 5432:5432
        # Every test leases its own database from this server and the leases
        # are exclusive, so the connection budget has to cover
        # `test threads * live AppStates per test` pools plus one session per
        # lease. The default 100 is not enough for a 16-thread runner.
        options: >-
          --health-cmd "pg_isready -U coland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g
    env:
      DATABASE_URL: postgres://coland:coland@localhost:5432/coland_ws
      COLAND_TEST_DATABASE_URL: postgres://coland:coland@localhost:5432/coland_ws
      # Demand is `test threads * live AppStates per test`, not the thread
      # count: restart fixtures hold two leases at once and the deep-stack
      # runners give each test its own thread. A 12-thread local run peaks near
      # 50, so this leaves headroom on a larger runner.
      COLAND_TEST_DATABASE_SLOTS: "192"
      # Keep the embedded runtime's test artifacts within hosted runner budgets.
      # Source backtraces remain available; optimization and stack settings stay default.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: arkret-org/coland

      - name: Checkout workspace dependencies
        uses: ./arkret-org/coland/.github/actions/checkout-workspace
        with:
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout canonical native test runner
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Python for native test isolation
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Rust 1.98
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coland -> target

      - name: Raise the PostgreSQL connection ceiling
        run: |
          docker exec "$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"             psql -U coland -d coland_ws -c "ALTER SYSTEM SET max_connections = 500;"
          docker restart "$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}')"
          for _ in {1..30}; do pg_isready -h localhost -p 5432 -U coland && break; sleep 1; done

      - name: Report test build resources
        run: |
          df -h .
          free -h
        working-directory: arkret-org/coland

      - name: Test (whole workspace, real database)
        env:
          CARGO_TARGET_DIR: target/test
        # Each process receives its own client config and a run-scoped CA;
        # the harness still verifies TLS and executes the entire workspace.
        run: python ../cotest/scripts/run-native-rust-tests.py cargo +1.98 test --locked --workspace
        working-directory: arkret-org/coland

  migration-cycle:
    name: Migration up/down/up cycle (postgres)
    runs-on: ubuntu-latest
    # Only run on Linux because the PostgreSQL service container is a
    # Linux-only feature in GitHub Actions. The cycle itself is
    # platform-agnostic — running it on one OS is sufficient.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coland
          POSTGRES_PASSWORD: coland
          POSTGRES_DB: coland_cycle
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://coland:coland@localhost:5432/coland_cycle
    steps:
      - name: Checkout coland
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install diesel_cli (postgres-only)
        run: |
          cargo install diesel_cli --no-default-features --features postgres --locked

      - name: Wait for postgres
        run: |
          for _ in {1..30}; do
            if pg_isready -h localhost -p 5432 -U coland; then
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Apply migrations forwards (baseline schema)
        run: diesel migration --migration-dir crates/storage-postgres/migrations run

      - name: Snapshot baseline schema
        run: |
          pg_dump --schema-only --no-owner --no-privileges \
            "$DATABASE_URL" > /tmp/schema.baseline.sql
        env:
          PGPASSWORD: coland

      - name: Revert every migration in reverse order
        run: diesel migration --migration-dir crates/storage-postgres/migrations revert --all

      - name: Re-apply every migration forwards
        run: diesel migration --migration-dir crates/storage-postgres/migrations run

      - name: Snapshot cycled schema
        run: |
          pg_dump --schema-only --no-owner --no-privileges \
            "$DATABASE_URL" > /tmp/schema.cycled.sql
        env:
          PGPASSWORD: coland

      - name: Diff cycled schema against baseline
        run: |
          # pg_dump randomizes these psql safety tokens on every invocation.
          # Compare all schema SQL unchanged; retain the original dumps too.
          sed '/^\\restrict /d; /^\\unrestrict /d' /tmp/schema.baseline.sql > /tmp/schema.baseline.ddl.sql
          sed '/^\\restrict /d; /^\\unrestrict /d' /tmp/schema.cycled.sql > /tmp/schema.cycled.ddl.sql
          if ! diff -u /tmp/schema.baseline.ddl.sql /tmp/schema.cycled.ddl.sql; then
            echo "::error::Migration up→down→up cycle did not round-trip cleanly."
            echo "::error::Each migration's down.sql must exactly invert its up.sql."
            exit 1
          fi

  postgres-storage-contracts:
    name: Postgres storage contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coland
          POSTGRES_PASSWORD: coland
          POSTGRES_DB: coland_contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://coland:coland@localhost:5432/coland_contracts
      COLAND_TEST_DATABASE_URL: postgres://coland:coland@localhost:5432/coland_contracts
    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: arkret-org/coland

      - name: Checkout workspace dependencies
        uses: ./arkret-org/coland/.github/actions/checkout-workspace
        with:
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout canonical native test runner
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coland -> target

      - name: Wait for postgres
        run: |
          for _ in {1..30}; do
            pg_isready -h localhost -p 5432 -U coland && break
            sleep 1
          done

      # These are the only proof the Postgres adapters honour the storage
      # contracts. They fail without `DATABASE_URL`, so a missing database
      # breaks the build instead of emptying the suite.
      - name: Storage contract and durable-plane tests
        run: python ../cotest/scripts/run-native-rust-tests.py cargo test --locked -p coland-storage-postgres --no-fail-fast
        working-directory: arkret-org/coland

  postgres-http-api:
    name: Postgres HTTP API cursor tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coland
          POSTGRES_PASSWORD: coland
          POSTGRES_DB: coland_cursor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coland"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://coland:coland@localhost:5432/coland_cursor
    steps:
      - name: Checkout coland
        uses: actions/checkout@v6
        with:
          path: arkret-org/coland

      - name: Checkout workspace dependencies
        uses: ./arkret-org/coland/.github/actions/checkout-workspace
        with:
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout canonical native test runner
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/cotest
          path: arkret-org/cotest
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: arkret-org/coland -> target

      - name: Wait for postgres
        run: |
          for _ in {1..30}; do
            pg_isready -h localhost -p 5432 -U coland && break
            sleep 1
          done

      - name: Test HTTP sync cursor contracts
        run: |
          set -euo pipefail
          selector='routing::events::sync::tests::'
          test_args=(cargo test --locked -p coland-http --lib "$selector")
          list_file="$RUNNER_TEMP/coland-http-sync-tests.txt"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --list > "$list_file"
          python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if not tests or any(not line.startswith(sys.argv[2]) for line in tests):
              raise SystemExit("HTTP sync selector must select its real nonempty test module")
          print(f"Selected {len(tests)} HTTP sync contract tests")
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}"
        working-directory: arkret-org/coland

      - name: Test PostgreSQL cursor persistence across restart
        run: |
          set -euo pipefail
          selector='sync_cursor::account_summary_query_tests::cursor_issuance_remains_immutable_across_store_restart'
          test_args=(cargo test --locked -p coland-storage-postgres --lib "$selector")
          list_file="$RUNNER_TEMP/coland-postgres-cursor-restart-tests.txt"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact --list > "$list_file"
          python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if tests != [f"{sys.argv[2]}: test"]:
              raise SystemExit("PostgreSQL cursor restart selector must select exactly its one test")
          print("Selected the PostgreSQL cursor restart regression")
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact
        working-directory: arkret-org/coland

      - name: Test qualified Circle current recovery contracts
        run: |
          set -euo pipefail
          selector='state::authority_forward::recovery_tests::circle_current_coverage_tests::'
          test_args=(cargo test --locked -p coland-http --lib "$selector")
          list_file="$RUNNER_TEMP/coland-http-circle-current-tests.txt"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --list > "$list_file"
          python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          expected = [
              f"{sys.argv[2]}qualified_circle_refresh_precedes_full_tail_when_metadata_is_physically_absent: test",
              f"{sys.argv[2]}unproved_circle_rejects_wrong_nonce_and_other_station_snapshot_without_effects: test",
              f"{sys.argv[2]}refused_fresh_bootstrap_still_consumes_actual_withheld_prefix_and_exact_self_leave: test",
          ]
          if sorted(tests) != sorted(expected):
              raise SystemExit("Circle current selector must select its three actual recovery tests")
          print("Selected all three qualified Circle current recovery tests")
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}"
        working-directory: arkret-org/coland

      - name: Test accepted own Circle leave keeps reads closed
        run: |
          set -euo pipefail
          selector='state::authority_forward::recovery_tests::accepted_own_leave_returns_original_bound_result_after_terminal_membership_and_keeps_reads_closed'
          test_args=(cargo test --locked -p coland-http --lib "$selector")
          list_file="$RUNNER_TEMP/coland-http-circle-own-leave-tests.txt"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact --list > "$list_file"
          python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if tests != [f"{sys.argv[2]}: test"]:
              raise SystemExit("Own Circle leave selector must select exactly its accepted-result regression")
          print("Selected the accepted own Circle leave regression")
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact
        working-directory: arkret-org/coland

      - name: Test Storage action windows and bounded current reads
        run: |
          set -euo pipefail
          selectors=(
            'realm_authorization_cut::operation_fact_tests::native_message_cut_uses_action_windows_and_keeps_global_refusals'
            'read_capacity_tests::typed_current_and_self_reads_stay_bounded_across_one_hundred_and_one_thousand_realms'
          )
          for selector in "${selectors[@]}"; do
            test_args=(cargo test --locked -p coland-storage-postgres --lib "$selector")
            list_file="$RUNNER_TEMP/coland-storage-circle-lib-fast-tests.txt"
            python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact --list > "$list_file"
            python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if tests != [f"{sys.argv[2]}: test"]:
              raise SystemExit("Storage library selector must select exactly its real regression")
          print(f"Selected Storage regression {sys.argv[2]}")
          PY
            python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact
          done
        working-directory: arkret-org/coland

      - name: Test real Circle grants and same-cut account snapshots
        run: |
          set -euo pipefail
          for target in circle_convenience_reads realm_membership_fanout; do
            case "$target" in
              circle_convenience_reads)
                selector='durable_circle_directory_and_member_details_follow_accepted_current'
                ;;
              realm_membership_fanout)
                selector='account_scoped_realm_snapshot_preserves_another_hosted_accounts_circle_at_the_same_cut'
                ;;
            esac
            test_args=(cargo test --locked -p coland-storage-postgres --test "$target" "$selector")
            list_file="$RUNNER_TEMP/coland-storage-circle-integration-fast-tests.txt"
            python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact --list > "$list_file"
            python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if tests != [f"{sys.argv[2]}: test"]:
              raise SystemExit("Storage integration selector must select exactly its real regression")
          print(f"Selected Storage regression {sys.argv[2]}")
          PY
            python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact
          done
        working-directory: arkret-org/coland

      - name: Test Circle opening join membership basis independently
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          selector='circle_own_opening_join_anchors_remote_stream_and_membership_basis_expires'
          test_args=(cargo test --locked -p coland-storage-postgres --test realm_membership_fanout "$selector")
          list_file="$RUNNER_TEMP/coland-circle-opening-join-exact-test.txt"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact --list > "$list_file"
          python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if tests != [f"{sys.argv[2]}: test"]:
              raise SystemExit("Circle opening join selector must select exactly its real regression")
          print("Selected the Circle opening join membership-basis regression")
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact
        working-directory: arkret-org/coland

      - name: Test held Full snapshot endpoint independently
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          selector='held_full_at_snapshot_endpoint_rejects_other_commit_id_without_writes'
          test_args=(cargo test --locked -p coland-storage-postgres --test realm_membership_fanout "$selector")
          list_file="$RUNNER_TEMP/coland-held-full-snapshot-endpoint-exact-test.txt"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact --list > "$list_file"
          python - "$list_file" "$selector" <<'PY'
          import pathlib
          import sys

          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          tests = [line for line in lines if line.endswith(": test")]
          if tests != [f"{sys.argv[2]}: test"]:
              raise SystemExit("Held Full endpoint selector must select exactly its real regression")
          print("Selected the held Full snapshot-endpoint regression")
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --exact
        working-directory: arkret-org/coland

      - name: Test the complete Circle fanout matrix independently
        if: ${{ !cancelled() }}
        working-directory: arkret-org/coland
        run: |
          set -euo pipefail
          target='realm_membership_fanout'
          test -f 'crates/storage-postgres/tests/realm_membership_fanout.rs'
          test_args=(cargo test --locked -p coland-storage-postgres --test "$target")
          list_file="$RUNNER_TEMP/coland-complete-realm-membership-fanout-list.txt"
          list_metadata="$RUNNER_TEMP/coland-complete-realm-membership-fanout-list.json"
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --list > "$list_file"
          python - "$list_file" "$target" "$list_metadata" <<'PY'
          import hashlib
          import json
          import pathlib
          import re
          import sys

          def parse_full_target_list(text, target):
              if target != "realm_membership_fanout":
                  raise ValueError("The complete Circle fanout target must be selected")
              names = []
              summaries = []
              other = 0
              for raw in text.splitlines():
                  line = re.sub(r"\x1b\[[0-9;]*m", "", raw).strip()
                  if not line:
                      continue
                  test = re.fullmatch(r"([A-Za-z_][A-Za-z0-9_]*(?:::[A-Za-z_][A-Za-z0-9_]*)*): test", line)
                  summary = re.fullmatch(r"([0-9]+) tests?, ([0-9]+) benchmarks?", line)
                  if test:
                      names.append(test.group(1))
                  elif summary:
                      summaries.append((int(summary.group(1)), int(summary.group(2))))
                  elif line.endswith(": benchmark"):
                      raise ValueError("The Circle fanout contract target must not select benchmarks")
                  else:
                      # Wrapper diagnostics are not test identities and are never echoed.
                      other += 1
              if not names or len(names) != len(set(names)) or summaries != [(len(names), 0)]:
                  raise ValueError("The complete Circle fanout list must be nonempty, unique and count-consistent")
              return {"package": "coland-storage-postgres", "target": target,
                      "test_count": len(names), "tests": names, "benchmarks": 0,
                      "non_test_output_line_count": other}

          if __name__ == "__main__":
              source = pathlib.Path(sys.argv[1])
              try:
                  value = parse_full_target_list(source.read_text(encoding="utf-8-sig"), sys.argv[2])
              except (OSError, UnicodeError, ValueError):
                  raise SystemExit("Invalid complete Circle fanout test list") from None
              value["raw_list_sha256"] = hashlib.sha256(source.read_bytes()).hexdigest()
              pathlib.Path(sys.argv[3]).write_text(json.dumps(value, indent=2) + "\n", encoding="utf-8")
              print(json.dumps(value, sort_keys=True))
          PY
          python ../cotest/scripts/run-native-rust-tests.py "${test_args[@]}" -- --test-threads=1
