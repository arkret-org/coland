coland-contracts = { version = "0.3.0", path = "crates/contracts" }
coland-domain = { version = "0.3.0", path = "crates/domain" }
coland-http = { version = "0.3.0", path = "crates/http" }
coland-services = { version = "0.3.0", path = "crates/services" }
coland-storage = { version = "0.3.0", path = "crates/storage" }
coland-storage-postgres = { version = "0.3.0", path = "crates/storage-postgres" }
coland-test-support = { version = "0.3.0", path = "crates/test-support" }
subtle = "2.6.1"
thiserror = "2"
tokio = "1.53.1"
tokio-postgres = "0.7.18"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
