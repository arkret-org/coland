[package]
name = "coland-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Persistence records and storage ports for Coland."

[features]
default = []
test-support = ["arkret-event-draft/test-support", "arkret-wire/test-support"]

[dependencies]
arkret-signatures = { workspace = true, features = ["collaboration"] }
arkret.workspace = true
arkret-canonical.workspace = true
arkret-event-draft.workspace = true
arkret-identifiers.workspace = true
arkret-identity.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-models-identity.workspace = true
arkret-models-integration.workspace = true
arkret-policy.workspace = true
arkret-schema.workspace = true
arkret-state.workspace = true
arkret-wire.workspace = true
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
chrono-tz = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
coland-domain = { workspace = true }
coland-contracts = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
uuid = { workspace = true, features = ["v4", "v7", "serde"] }

[dev-dependencies]
arkret-event-draft = { workspace = true, features = ["test-support"] }
arkret-wire = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
