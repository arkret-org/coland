[package]
name = "coland-test-support"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Development-only fixtures and helpers for Coland integration tests."
publish = false

[dependencies]
diesel = { workspace = true, features = ["postgres", "serde_json"] }
diesel-async = { workspace = true, features = ["postgres", "deadpool"] }
arkret.workspace = true
arkret-bootstrap.workspace = true
arkret-canonical.workspace = true
arkret-event-draft = { workspace = true, features = ["test-support"] }
arkret-identifiers.workspace = true
arkret-identity.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-models-identity.workspace = true
arkret-policy.workspace = true
arkret-schema.workspace = true
arkret-signatures.workspace = true
arkret-state.workspace = true
arkret-test-kit.workspace = true
arkret-wire = { workspace = true, features = ["test-support"] }
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde_json.workspace = true
sha2.workspace = true
coland-domain = { version = "0.3.0", path = "../domain" }
coland-http = { version = "0.3.0", path = "../http", features = ["test-support"] }
coland-services = { version = "0.3.0", path = "../services", features = ["test-support"] }
coland-storage = { version = "0.3.0", path = "../storage" }
coland-storage-postgres = { version = "0.3.0", path = "../storage-postgres", features = [
    "test-support",
] }
tokio = { workspace = true, features = ["rt"] }
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
