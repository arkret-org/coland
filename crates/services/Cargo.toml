[package]
name = "coland-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Transport- and adapter-independent Coland application use cases."

[features]
default = []
test-support = ["coland-storage/test-support"]

[dependencies]
arkret.workspace = true
arkret-canonical.workspace = true
arkret-event-draft.workspace = true
arkret-identifiers.workspace = true
arkret-identity.workspace = true
arkret-models-collaboration.workspace = true
arkret-models-crypto.workspace = true
arkret-models-identity.workspace = true
arkret-policy.workspace = true
arkret-schema = { workspace = true }
arkret-signatures = { workspace = true, features = ["collaboration", "signer"] }
arkret-state.workspace = true
arkret-wire.workspace = true
async-trait.workspace = true
bytes.workspace = true
chrono = { workspace = true, features = ["serde"] }
ed25519-dalek.workspace = true
futures-util.workspace = true
hex.workspace = true
getrandom.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
coland-domain.workspace = true
coland-storage.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v7"] }

[dev-dependencies]
arkret-schema-conformance = { workspace = true }
arkret-event-draft = { workspace = true, features = ["test-support"] }
coland-storage-postgres = { workspace = true, features = ["test-support"] }
tokio = { workspace = true, features = ["macros"] }

[lints]
workspace = true
